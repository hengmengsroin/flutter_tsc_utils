name: Publish to pub.dev

on:
  push:
    tags:
      # Tag pattern configured on pub.dev: v{{version}}
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: checks
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
